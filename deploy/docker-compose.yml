# Phase 1 single-box deployment (design §9): Orthanc + Redis + Postgres +
# MinIO + one worker + the streaming/catalog API behind nginx.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Then send DICOM to localhost:4242 (AET OMV) and browse the catalog at
# http://localhost:8000/v1/studies (Authorization: Bearer dev-client-token).

name: openmedvideo

services:
  orthanc:
    image: orthancteam/orthanc:latest
    ports:
      - "4242:4242"   # DICOM C-STORE
      - "8042:8042"   # Orthanc UI/REST (dev only; keep off public networks)
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc/omv-hook.lua:/etc/orthanc/omv-hook.lua:ro
      - orthanc-db:/var/lib/orthanc/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omv
      POSTGRES_PASSWORD: omv
      POSTGRES_DB: omv
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: omv-minio
      MINIO_ROOT_PASSWORD: omv-minio-secret
    ports:
      - "9001:9001"   # console (dev only)
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 omv-minio omv-minio-secret; do sleep 1; done;
      mc mb --ignore-existing local/medvideo;
      exit 0"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    environment: &omv-env
      OMV_DATABASE_URL: postgres://omv:omv@postgres/omv
      OMV_REDIS_URL: redis://redis:6379
      OMV_ORTHANC_URL: http://orthanc:8042
      OMV_ORTHANC_USER: omv
      OMV_ORTHANC_PASSWORD: omv
      OMV_STORAGE_URL: s3://medvideo
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: omv-minio
      AWS_SECRET_ACCESS_KEY: omv-minio-secret
      AWS_REGION: us-east-1
      OMV_TOKEN_SECRET: dev-only-change-me-in-production
      OMV_CLIENT_TOKENS: dev-client-token
      OMV_SEED_DEV_CLIENT: "1"
      OMV_EXPORT_ENABLED: "1"
      RUST_LOG: info
    depends_on: [postgres, redis, minio-init]
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    environment:
      <<: *omv-env
      OMV_PHI_RULES: /etc/omv/phi-rules.json
      OMV_MAX_ATTEMPTS: "3"
      OMV_RETRY_IDLE_SECS: "15"   # dev: fast retries; production default is 60
    volumes:
      - ./phi-rules.json:/etc/omv/phi-rules.json:ro
    depends_on: [postgres, redis, minio-init, orthanc, api]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"   # Prometheus UI (dev only)
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [api, worker]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"   # Grafana UI (dev only)
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin      # dev only — change for prod
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: system
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    restart: unless-stopped

volumes:
  orthanc-db:
  pg-data:
  minio-data:
  grafana-data:
