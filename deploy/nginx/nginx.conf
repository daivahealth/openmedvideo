# Phase 1 edge: TLS termination and caching live here in production; for the
# dev compose it simply fronts the API. In Phase 2 nginx serves HLS segments
# directly from MinIO with token validation, bypassing the API hot path.

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=hls:10m max_size=1g inactive=10m;

server {
    listen 80;

    # HLS objects: cacheable (segments are immutable once written).
    location /stream/ {
        proxy_pass http://api:8080;
        proxy_cache hls;
        proxy_cache_valid 200 5m;
        proxy_cache_key $uri;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
