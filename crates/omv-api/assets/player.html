<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenMedVideo</title>
<style>
  * { margin: 0; }
  html, body { height: 100%; background: #0c0f12; }
  omv-player { height: 100%; border-radius: 0; }
  #error { color: #e0a93e; padding: 20px; text-align: center;
    font: 14px -apple-system, "Segoe UI", Roboto, sans-serif; }
</style>
<script src="/player-assets/omv-player.js"></script>
</head>
<body>
<script>
  // The embeddable page (tier 1) is a thin shell over <omv-player> (tier 2):
  // one codebase for both. URL shape: /player/{token}/{study_uid}
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts.length >= 3) {
    const el = document.createElement("omv-player");
    el.setAttribute("token", parts[1]);
    el.setAttribute("study-id", parts[2]);
    document.body.appendChild(el);
    el.focus();
  } else {
    document.body.innerHTML = '<p id="error">Malformed player link.</p>';
  }
</script>
</body>
</html>
